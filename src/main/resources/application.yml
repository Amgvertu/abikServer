spring:
  application:
    name: abik-server
  profiles:
    active: dev          # для локальной разработки. На малинке переопределим через systemd.
  jpa:
    hibernate:
      ddl-auto: validate # Flyway создаёт схему, Hibernate её только проверяет
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    access-ttl-minutes: 30
    refresh-ttl-days: 60
    secret: "aB7xK9mN2pQ4wR8tY1uI3oP5aS6dF7gH9jL0zXcVbNmQwErTyUiOpAsD"
  sms:
    provider: mock
  files:
    dir: "./uploads"                 # папка для аватаров и логотипов
    max-size-bytes: 5242880          # 5 МБ
    allowed-mime: "image/jpeg,image/png,image/webp"
  fcm:
    service-account-path: "classpath:firebase-service-account.json"
    enabled: true                    # false — в dev-режиме просто логировать
