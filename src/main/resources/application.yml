spring:
  application:
    name: abik-server
  profiles:
    active: dev          # для локальной разработки. На малинке переопределим через systemd.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate # Flyway создаёт схему, Hibernate её только проверяет
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

